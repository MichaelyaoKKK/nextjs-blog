<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Alisa 内容管理</title>
    <style>
      :root { font-family:system-ui,"Noto Sans SC",sans-serif; color:#27223a; background:#fffaf2; }
      * { box-sizing:border-box; } body { margin:0; } main { width:min(1000px,calc(100% - 32px)); margin:40px auto 80px; }
      a { color:#bc3652; } h1 { margin:12px 0; font-size:clamp(32px,5vw,54px); } h2 { margin:38px 0 16px; }
      .intro { max-width:680px; color:#665d70; line-height:1.7; }
      .top { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:16px; }
      .top-actions { display:flex; gap:16px; align-items:center; }
      .panel { margin-top:26px; padding:26px; border:1px solid #eadde0; border-radius:24px; background:white; box-shadow:0 14px 35px rgba(61,37,71,.08); }
      .auth { max-width:520px; } .fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
      label { display:grid; gap:7px; font-size:14px; font-weight:700; } input,textarea { width:100%; padding:12px 14px; border:1px solid #cfc5d2; border-radius:12px; font:inherit; color:#27223a; background:#fff; }
      input:focus,textarea:focus { outline:2px solid #ef596f; outline-offset:2px; } textarea { min-height:90px; resize:vertical; }
      button { padding:12px 20px; border:0; border-radius:999px; background:#27223a; color:white; font:700 14px inherit; cursor:pointer; }
      button:hover { background:#bc3652; } button.secondary { border:1px solid #27223a; color:#27223a; background:white; }
      button:disabled { opacity:.55; cursor:wait; } .module { display:grid; grid-template-columns:170px 1fr; gap:22px; }
      .preview { display:grid; place-items:center; min-height:170px; overflow:hidden; border-radius:18px; background:#ffe0a2; color:#27223a; font-size:54px; font-weight:900; }
      .preview img { width:100%; height:170px; object-fit:cover; } .module-fields { display:grid; gap:14px; }
      .module-actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; } .notice { color:#665d70; font-size:13px; line-height:1.6; }
      #message { min-height:24px; margin-top:16px; color:#a02543; font-weight:700; } .saved { color:#236e50 !important; }
      [hidden] { display:none !important; }
      @media(max-width:680px) { .module,.fields { grid-template-columns:1fr; }.preview { min-height:120px; }.preview img { height:160px; } main { margin-top:22px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="top"><div><a href="/">返回网站</a><h1>内容管理</h1></div><div class="top-actions"><span id="account-name"></span><button id="logout" class="secondary" hidden>退出登录</button></div></div>
      <p class="intro">由家长管理代表作品、作品小宇宙和日常模块。图片支持 PNG、JPEG、WebP，单张不超过 3 MB。修改后点击对应模块的“保存更改”。</p>
      <section id="auth-panel" class="panel auth">
        <h2 id="auth-title">管理员登录</h2>
        <form id="auth-form" class="module-fields">
          <label>管理员用户名<input name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_-]+" /></label>
          <label>密码<input name="password" type="password" autocomplete="current-password" required minlength="12" /></label>
          <button type="submit">登录</button>
        </form>
        <p id="setup-hint" class="notice" hidden>首次使用请创建管理员账户。请妥善保管密码；账户文件只保存在本机。</p>
      </section>
      <section id="editor" hidden>
        <h2>代表作品预览</h2><div id="preview-list"></div>
        <h2>作品小宇宙</h2><div id="works-list"></div>
        <h2>日常像一盒彩笔</h2><div id="daily-list"></div>
      </section>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script src="admin.js" defer></script>
  </body>
</html>
