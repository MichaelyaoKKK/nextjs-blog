media:
  input: public/images
  output: /images
  rename: random
  extensions: [jpg, jpeg, png, webp]

content:
  - name: homepage
    label: 首页与页面文字
    type: file
    path: src/data/page.json
    format: json
    fields:
      - { name: siteTitle, label: 网站标题, type: string, required: true }
      - { name: brandName, label: 品牌名称, type: string, required: true }
      - { name: metaDescription, label: 页面简介, type: text, required: true }
      - { name: navAbout, label: 关于我导航, type: string, required: true }
      - { name: navWorks, label: 作品导航, type: string, required: true }
      - { name: navContact, label: 联系导航, type: string, required: true }
      - { name: heroEyebrow, label: 首屏短句, type: string, required: true }
      - { name: heroTitleFirst, label: 首屏标题第一行, type: string, required: true }
      - { name: heroTitleSecond, label: 首屏标题第二行, type: string, required: true }
      - { name: heroIntro, label: 首屏介绍, type: text, required: true }
      - { name: heroWorksButton, label: 作品按钮文字, type: string, required: true }
      - { name: heroDailyButton, label: 日常按钮文字, type: string, required: true }
      - { name: heroImage, label: 首屏图片, type: image }
      - { name: heroImageAlt, label: 首屏图片说明, type: string, required: true }
      - { name: heroBadge, label: 首屏贴纸文字, type: string, required: true }
      - { name: aboutTitleFirst, label: 关于我标题第一行, type: string, required: true }
      - { name: aboutTitleSecond, label: 关于我标题第二行, type: string, required: true }
      - { name: aboutBody, label: 关于我正文, type: text, required: true }
      - { name: aboutTags, label: 关于我标签, type: string, list: true }
      - { name: worksTitle, label: 作品区标题, type: string, required: true }
      - { name: worksIntro, label: 作品区介绍, type: text, required: true }
      - { name: dailyTitleFirst, label: 日常区标题第一行, type: string, required: true }
      - { name: dailyTitleSecond, label: 日常区标题第二行, type: string, required: true }
      - { name: dailyIntro, label: 日常区介绍, type: text, required: true }
      - { name: dailyCardLink, label: 日常卡片链接文字, type: string, required: true }
      - { name: contactTitleFirst, label: 联系区标题第一行, type: string, required: true }
      - { name: contactTitleSecond, label: 联系区标题第二行, type: string, required: true }
      - { name: contactNote, label: 家长联系邮箱, type: string, required: true }
      - { name: footerNote, label: 页脚短句, type: string, required: true }

  - name: works
    label: 作品小宇宙
    type: file
    path: src/data/works.json
    format: json
    list: true
    fields:
      - { name: title, label: 作品名称, type: string, required: true }
      - { name: category, label: 分类, type: string, required: true }
      - { name: note, label: 作品介绍, type: text, required: true }
      - { name: image, label: 作品图片, type: image }

  - name: daily
    label: 日常像一盒彩笔
    type: file
    path: src/data/daily.json
    format: json
    list: true
    fields:
      - { name: title, label: 日常标题, type: string, required: true }
      - { name: copy, label: 日常内容, type: text, required: true }
      - { name: image, label: 日常图片, type: image }
