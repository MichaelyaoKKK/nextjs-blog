  - name: works
    label: 作品小宇宙
    type: file
    path: src/data/works.json
    format: json
    list: true
    fields:
      - { name: slug, label: 相册网址标识（小写英文和连字符，不要随意修改）, type: string, required: true, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
      - { name: title, label: 作品名称, type: string, required: true }
      - { name: titleEn, label: 作品名称（English）, type: string, required: true }
      - { name: titleFr, label: 作品名称（Français）, type: string, required: true }
      - { name: category, label: 分类, type: string, required: true }
      - { name: categoryEn, label: 分类（English）, type: string, required: true }
      - { name: categoryFr, label: 分类（Français）, type: string, required: true }
      - { name: note, label: 作品介绍, type: text, required: true }
      - { name: noteEn, label: 作品介绍（English）, type: text, required: true }
      - { name: noteFr, label: 作品介绍（Français）, type: text, required: true }
      - { name: image, label: 封面图片（需从下方相册图片中选择）, type: image }
      - name: gallery
        label: 相册照片（三语共用，可添加多张）
        type: object
        list:
          max: 30
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: image, label: 照片图片, type: image, required: true }
          - { name: title, label: 照片名称（英文，不含文件后缀）, type: string, required: true }

  - name: daily
    label: 日常像一盒彩笔
    type: file
    path: src/data/daily.json
    format: json
    list: true
    fields:
      - { name: slug, label: 相册网址标识（小写英文和连字符，不要随意修改）, type: string, required: true, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
      - { name: title, label: 日常标题, type: string, required: true }
      - { name: titleEn, label: 日常标题（English）, type: string, required: true }
      - { name: titleFr, label: 日常标题（Français）, type: string, required: true }
      - { name: copy, label: 日常内容, type: text, required: true }
      - { name: copyEn, label: 日常内容（English）, type: text, required: true }
      - { name: copyFr, label: 日常内容（Français）, type: text, required: true }
      - { name: image, label: 封面图片（需从下方相册图片中选择）, type: image }
      - name: gallery
        label: 相册照片（三语共用，可添加多张）
        type: object
        list:
          max: 30
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: image, label: 照片图片, type: image, required: true }
          - { name: title, label: 照片名称（英文，不含文件后缀）, type: string, required: true }
